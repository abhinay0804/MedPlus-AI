# Render Blueprint — MedPulse AI
# Deploy: Dashboard → New → Blueprint → Connect GitHub repo
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: medpulse-db
    plan: free
    databaseName: medpulse
    user: medpulse_user

services:
  # ─────────────────────────────────────────────
  # 1. FastAPI Backend + Celery Worker (Web Service)
  #    Runs both API and background tasks in one process
  # ─────────────────────────────────────────────
  - type: web
    name: medpulse-api
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: medpulse-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://medpulse-ai.onrender.com
      - key: GOOGLE_GENAI_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://medpulse-api.onrender.com/api/auth/google/callback

  # ─────────────────────────────────────────────
  # 2. React Frontend (Static Site)
  # ─────────────────────────────────────────────
  - type: web
    name: medpulse-ai
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /api/*
        destination: https://medpulse-api.onrender.com/api/*
      - type: rewrite
        source: /ws/*
        destination: https://medpulse-api.onrender.com/ws/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://medpulse-api.onrender.com/api

  # ─────────────────────────────────────────────
  # 3. Redis (Managed Key-Value Store)
  # ─────────────────────────────────────────────
  - type: redis
    name: medpulse-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
